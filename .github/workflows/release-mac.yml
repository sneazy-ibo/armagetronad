name: Release (macOS)

# Packages the app bundle and attaches it to a GitHub release, as a .zip (the
# bundle stays a bundle) and as a .dmg.
#
# Two ways in:
#   * push a mac-* tag, for a version prepared in advance
#   * run this workflow by hand with a version, which tags the branch it is
#     run from - the "this change deserves a download" button
#
# A release needs curated notes at .github/release-notes/<version>.md (the tag
# without the mac- prefix); the workflow refuses to publish without them, so a
# release always says what changed. Re-running for an existing tag refreshes the
# assets and notes instead of failing.
#
# Tags must be mac-* and ours: sync-upstream.yml mirrors upstream's tags into
# this repository, and it skips mac-* tags so it can never clobber a release.

on:
  push:
    tags: [ 'mac-*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag, e.g. 0.4.0-2 (becomes mac-v0.4.0-2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=mac-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Homebrew dependencies
        run: |
          brew install pkg-config autoconf automake ftgl glew protobuf boost \
                       sdl2 sdl2_image sdl2_mixer libpng dylibbundler

      - name: Build and bundle
        run: |
          ./macos-build.sh --bundle --self-contained --clean \
            --name "Armagetron Advanced" \
            --build-dir "$GITHUB_WORKSPACE/.build" \
            --prefix "$GITHUB_WORKSPACE/dist"

      - name: Package the bundle
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # ditto keeps the bundle structure and its symlinks intact
          ditto -c -k --keepParent "dist/Armagetron Advanced.app" "Armagetron-${TAG}.zip"
          hdiutil create -volname "Armagetron Advanced" \
            -srcfolder "dist/Armagetron Advanced.app" \
            -ov -format UDZO "Armagetron-${TAG}.dmg"
          ls -lh Armagetron-*

      - name: Keep the packages with the run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: |
            Armagetron-*.zip
            Armagetron-*.dmg
          retention-days: 90

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Curated notes are required: a release must say what changed. The tag
          # is "mac-v<version>", so the file may be named with or without the
          # "mac-" prefix.
          NOTES=""
          for candidate in ".github/release-notes/${TAG}.md" \
                           ".github/release-notes/${TAG#mac-}.md"; do
            if [ -f "$candidate" ]; then
              NOTES="$candidate"
              break
            fi
          done

          if [ -z "$NOTES" ]; then
            echo "::error::No release notes for $TAG. Add .github/release-notes/${TAG#mac-}.md"
            echo "The workflow refuses to publish a release with no notes."
            exit 1
          fi
          echo "Using release notes from $NOTES"

          ZIP="Armagetron-${TAG}.zip"
          DMG="Armagetron-${TAG}.dmg"

          # Re-running for a tag that already has a release should refresh the
          # build rather than fail, so pushing a tag twice is harmless.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its assets and notes"
            gh release upload "$TAG" "$ZIP" "$DMG" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --notes-file "$NOTES" "$ZIP" "$DMG"
          else
            gh release create "$TAG" --notes-file "$NOTES" "$ZIP" "$DMG"
          fi

      - name: Note the missing signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Append the signature warning once. On a re-release the note is already
          # there, so leave it alone instead of stacking duplicates.
          marker="not signed or notarised"
          notes="$(gh release view "$TAG" --json body --jq .body)"
          if printf '%s' "$notes" | grep -qF "$marker"; then
            echo "Signature note already present; leaving it as is"
            exit 0
          fi

          gh release edit "$TAG" --notes "${notes}

          The app is not signed or notarised: after unzipping it, right-click and choose Open once, and macOS will let it start from then on."
