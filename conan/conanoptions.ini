[tool_requires]
# the only gettext that works on Ubuntu 24.04; pulseaudio depends on it
pulseaudio/*: gettext/0.22.5

# conanoptions.ini for ArmagetronAd
[options]
sdl2/*:shared=True
libxml2/*:html=False
libxml2/*:http=False
libxml2/*:ftp=False
libxml2/*:zlib=False
libxml2/*:iconv=False

libsndfile/*:with_external_libs=False
libsndfile/*:with_mpeg=False
libsndfile/*:programs=False

sdl/*:directx=False
sdl/*:x11=False
sdl/*:xvm=False
sdl/*:xcb=False
sdl/*:vulkan=False
sdl/*:opengles=False
sdl/*:libunwind=False
sdl/*:hidapi=False
# sdl/*:pulse=False # well, then you don't get audio
sdl/*:alsa=False
sdl/*:sndio=False
sdl/*:iconv=False
sdl/*:xshape=False
sdl/*:xcursor=False
sdl/*:xinput=False
sdl/*:xrandr=False
sdl/*:xinerama=False

sdl_image/*:with_libtiff=False
sdl_image/*:with_libwebp=False
sdl_image/*:with_jxl=False
sdl_image/*:with_aviv=False

sdl_mixer/*:with_flac=False
sdl_mixer/*:with_mpg123=False
sdl_mixer/*:with_opus=False

libcurl/*:with_ssl=False
libcurl/*:with_https=False
libcurl/*:with_ftp=False
libcurl/*:with_file=False
libcurl/*:with_rtsp=False
libcurl/*:with_dict=False
libcurl/*:with_telnet=False
libcurl/*:with_tftp=False
libcurl/*:with_pop3=False
libcurl/*:with_imap=False
libcurl/*:with_smtp=False
libcurl/*:with_gopher=False
libcurl/*:static=False
libglvnd/*:glx=False

*:x11=False
*:*=False
*:shared=True
*:iconv=False

# exception, only used by protobuf, this will hopefully reduce total binary size
abseil/*:shared=False

# using deps from conan can be disabled with these lines
#armagetronad_deps/*:xml2=False
#armagetronad_deps/*:sdl=False
#armagetronad_deps/*:curl=False
#armagetronad_deps/*:protobuf=False
#armagetronad_deps/*:ftgl=False
#armagetronad_deps/*:boost=False
#armagetronad_deps/*:glew=False
